name: Update quizzes

on:
  schedule:
    # Every 6 hours. Quizzes post roughly daily, so this is never far behind.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch quizzes
        run: ./fetch-quizzes.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- quizzes.json; then
            echo "No new quizzes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quizzes.json
          git commit -m 'Update quizzes'
          git push
